<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Quantum Compass interface preview</title>
  <desc id="desc">A dark Quantum Compass QAOA landscape dashboard with controls, a contour landscape, and summary metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
